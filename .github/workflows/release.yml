# Every push to main: run all tests, then bump the version, tag it, build the .deb
# and publish it on the GitHub Releases page.
#
# Version bump (from the pushed commit messages):
#   - contains "#major" → 1.4.2 → 2.0.0
#   - contains "#minor" → 1.4.2 → 1.5.0
#   - otherwise         → 1.4.2 → 1.4.3
#   - if package.json's version has never been released (no tag yet), it is released as is
#     (so bumping it by hand in a commit still works).
# You can also run it by hand from the Actions tab and pick the bump.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version commit + tag, create the release

jobs:
  tests:
    # The bot's own version commit doesn't need another release.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to know what was already released

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the new version
        id: version
        env:
          MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
          MANUAL: ${{ inputs.bump }}
        run: |
          current=$(node -p "require('./package.json').version")
          if ! git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            echo "v$current was never released: releasing it as is"
            echo "version=$current" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bump=${MANUAL:-patch}
          if [ -z "$MANUAL" ]; then
            case "$MESSAGES" in *"#major"*) bump=major ;; *"#minor"*) bump=minor ;; esac
          fi
          npm version "$bump" --no-git-tag-version >/dev/null
          version=$(node -p "require('./package.json').version")
          echo "Bump $bump: $current → $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Commit and tag the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUMPED: ${{ steps.version.outputs.bumped }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$BUMPED" = "true" ]; then
            git commit -am "chore(release): v$VERSION"
            git push origin HEAD:main
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - run: npm ci

      - name: Build the package
        run: npm run dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release/*.deb
          generate_release_notes: true
