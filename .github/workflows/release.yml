# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to
# test, build the .deb on Ubuntu 24.04 and publish it on the GitHub Releases page.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the .deb

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the package
        run: npm run dist

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.deb
          generate_release_notes: true
